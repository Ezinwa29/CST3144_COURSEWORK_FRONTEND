<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coursework</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
      <div id="myApp">
        <h1>{{siteName}}</h1>
        <br>
        <div v-for="lesson in lessons" :key="lesson.id">
            <img v-bind:src="lesson.image.url" v-bind:alt="lesson.image.alt" />
            <p><b>Subject:</b> {{ lesson.subject }}</p>
            <p><b>Location:</b> {{ lesson.location }}</p>
            <p><b>Price:</b> {{ lesson.price }}</p>
            <p><b>Availability:</b> {{lesson.availability}}</p>
            <button v-on:click="addToCart(lesson)" v-bind:disabled="!canAddToCart(lesson)">Add to Cart</button>
        </div>
    </div>

        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    siteName: "After School Classes",
                    cart: [],
                    lessons: [
                        {image: {

                        },
                        id: 1001,

                        availability: 5

                      { image: {

                     },
                      { image: {

                        },

                addToCart(lesson) {
                    this.cart.push(lesson.id)

                canAddToCart(lesson) {
                    return lesson.availability > 0

            }
        }).mount('#myApp');
