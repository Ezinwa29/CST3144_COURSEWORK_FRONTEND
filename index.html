<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coursework</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="myApp">
        <div>{{subject}}</div>
        <div>{{location}}</div>
        <div>{{price}}</div>
        <img v-bind:src="image.url" v-bind:alt="image.alt" />
    </div>
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    
                            subject: 'Computer Science', 
                            location: 'Hendon', 
                            price: 'Rs2000', 
                            image:{
                                url:"../CST3144_COURSEWORK_FRONTEND/images/computer_science_img.jpg",
                                alt:"Computer Science lesson image"
                            }
                    
                }
            },
        }).mount('#myApp');
    </script>
</body>
</html>
