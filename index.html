<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coursework</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/4.7.0/css/font-awesome.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
      <div id="myApp">
        <h1>{{siteName}}</h1>
        <br>
        <button v-on:click="toggleCart()" v-bind:disabled="cart.length === 0 && !showCart">
            <i class="fa fa-shopping-cart" aria-hidden="true"></i>
            {{ showCart ? "Back to lessons" : "Cart (" + cartItemCount + ")" }}
        </button>

        <div v-if="!showCart">
           <div v-for="lesson in lessons" :key="lesson.id">
            <img v-bind:src="lesson.image.url" v-bind:alt="lesson.image.alt" />
            <p><b>Subject:</b> {{ lesson.subject }}</p>
            <p><b>Location:</b> {{ lesson.location }}</p>
            <p><b>Price:</b> {{ lesson.price }}</p>
            <p><b>Space(s):</b> {{lesson.space}}</p>
            <button v-on:click="addToCart(lesson)" v-bind:disabled="!canAddToCart(lesson)">Add to Cart</button>
           </div>
        </div>
        
        <div v-else>
            <h2>My Cart</h2>
            <p v-if="cart.length === 0">Your cart is empty</p>
            <div v-for="lesson in lessons" :key="lesson.id">
                <div v-if="lessonCount(lesson.id) > 0">
                    {{ lesson.subject }}, {{ lesson.location }}:
                    {{ lessonCount (lesson.id) }} x {{ lesson.price }}
                    <button v-on:click="removeFromCart(lesson)" >Remove</button>
                </div>
            </div>
        </div>
        
    </div>
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    siteName: "After School Classes",
                    cart: [],
                    showCart: false,
                    lessons: [
                        {image: {
                            url:"../CST3144_COURSEWORK_FRONTEND/images/computer_science_img.jpg", alt:"Computer Science Lesson Image"
                        },
                        id: 1001, 
                        subject:'Computer Science', 
                        location:'Hendon', 
                        price: '2000',
                        space: 5
                        
                     },
                      { image: {
                            url:"../CST3144_COURSEWORK_FRONTEND/images/maths_image.jpg", alt:"Mathematics Lesson Image"
                        },
                        id: 1002, 
                        subject:'Mathematics', 
                        location:'Dubai', 
                        price: '2500', 
                        space: 5
                        
                     },
                      { image: {
                            url:"../CST3144_COURSEWORK_FRONTEND/images/english_image.jpg", alt:"English Lesson Image"
                        },
                        id: 1003, 
                        subject:'English', 
                        location:'Mauritius', 
                        price: '3000', 
                        space: 5
                        
                     },
                      { image: {
                            url:"../CST3144_COURSEWORK_FRONTEND/images/science_image.jpg", alt:"Science Lesson Image"
                        },
                        id: 1004, 
                        subject:'Science', 
                        location:'Hendon', 
                        price: '2800', 
                        space: 5
                        
                     },
                      { image: {
                            url:"../CST3144_COURSEWORK_FRONTEND/images/music_image.jpg", alt:"Music Lesson Image"
                        },
                        id: 1005, 
                        subject:'Music', 
                        location:'Dubai', 
                        price: '1500',
                        space: 5
                        
                     },
                      {  image: {
                            url:"../CST3144_COURSEWORK_FRONTEND/images/history_image.jpg", alt:"History Lesson Image"
                        },
                        id: 1006, 
                        subject:'History', 
                        location:'Mauritius', 
                        price: '1800', 
                        space: 5
                    
                     },
                      { image: {
                            url:"../CST3144_COURSEWORK_FRONTEND/images/geography_image.jpg", alt:"Geography Lesson Image"
                        },
                        id: 1007, 
                        subject:'Geography', 
                        location:'Hendon', 
                        price: '1600',
                        space: 5
                        
                     },
                      { image: {
                            url:"../CST3144_COURSEWORK_FRONTEND/images/photography_image.jpg", alt:"Photography Lesson Image"
                        },
                        id: 1008, 
                        subject:'Photography', 
                        location:'Mauritius', 
                        price: '2200',
                        space: 5
                        
                     },
                      {  image: {
                            url:"../CST3144_COURSEWORK_FRONTEND/images/football_image.jpg", alt:"Football Lesson Image"
                        },
                        id: 1009, 
                        subject:'Football', 
                        location:'Dubai', 
                        price: '2500', 
                        space: 5
                       
                     },
                      { image: {
                            url: "../CST3144_COURSEWORK_FRONTEND/images/basketball_image.jpg", alt: "Basketball Lesson Image"
                        },
                        id: 1010, 
                        subject:'Basketball', 
                        location:'Hendon', 
                        price: '2700', 
                        space: 5
                        
                     }
                    ]
                    
                }
            },

            computed: {
                cartItemCount(){
                    return this.cart.length
                }

            },

            methods: {
                addToCart(lesson) {
                    this.cart.push(lesson.id)
                    lesson.space--
                },

                canAddToCart(lesson) {
                    return lesson.space > 0
                },

                toggleCart(){
                    this.showCart = !this.showCart
                },
                
                lessonCount(id) {
                    return this.cart.filter(item => item === id).length
                },
                
                removeFromCart(lesson) {const index = this.cart.indexOf(lesson.id)
                    if (index > -1) {
                        this.cart.splice(index, 1)
                        lesson.space++
                    }
                },
            }
        }).mount('#myApp');
    </script>
</body>
</html>
